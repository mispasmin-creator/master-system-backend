# Merge System — backend API + its own Postgres.
# The Next.js frontend runs on the host (npm run dev) and talks to the API at
# http://localhost:5000/api, which this file exposes.
#
#   Start:   docker compose up --build
#   Stop:    docker compose down          (add -v to also wipe the DB volume)
#   Logs:    docker compose logs -f backend
name: merge-system

services:
  db:
    image: postgres:16-alpine
    container_name: merge-system-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "141976"
      POSTGRES_DB: postgres
    ports:
      # Host 5433 -> container 5432 so it does NOT clash with your existing
      # local pgAdmin Postgres on 5432. Connect pgAdmin to localhost:5433.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: merge-system-backend
    ports:
      - "5000:5000"
    # .env supplies JWT_SECRET, PORT, etc. at runtime (it is NOT baked into the
    # image — see .dockerignore).
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    environment:
      - NODE_ENV=production
      # Overrides the .env DATABASE_URL: "db" is the compose service hostname on
      # the shared docker network (inside a container, localhost is the
      # container itself, not the host or the db service).
      - DATABASE_URL=postgresql://postgres:141976@db:5432/postgres
    # Wait for the DB (depends_on healthcheck), sync the Prisma schema to it,
    # seed the default admin (idempotent), then start the API. Client was
    # already generated at build time.
    command: sh -c "npx prisma db push --skip-generate && node prisma/seed.js && node server.js"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
